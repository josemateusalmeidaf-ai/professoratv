<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102544">
  <title>Visão geral · EDU+</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="app" data-module="dashboard">
  <div id="app-shell">
    <aside class="lateral" aria-label="Navegação principal">
      <a class="marca" href="../dashboard/index.html">EDU<span>+</span><small>PORTAL ESCOLAR</small></a>
      <div class="escola-identidade">
        <span class="escola-selo" aria-hidden="true">E</span>
        <span><strong>Área de trabalho</strong><small>Ambiente institucional</small></span>
      </div>
      <nav id="menu" aria-label="Módulos"></nav>
      <div class="lateral-rodape">
        <span id="u-avatar" class="avatar" aria-hidden="true">?</span>
        <span class="usuario-info"><strong id="u-nome"></strong><small id="u-perfil"></small></span>
        <button id="sair" class="sair" type="button" aria-label="Sair da conta" title="Sair">↗</button>
      </div>
    </aside>
    <div class="conteudo">
      <header class="topo-m">
        <button id="burger" class="menu-toggle sec peq" type="button" aria-label="Abrir menu" aria-expanded="false">☰</button>
        <a class="marca" href="../dashboard/index.html">EDU<span>+</span></a>
        <span id="topo-perfil" class="topo-perfil"></span>
      </header>
      <main id="view" class="container" aria-live="polite">
        <header class="cab"><div><h1>Visão geral</h1><p>Carregando os dados da escola…</p></div></header>
        <section class="painel"><p class="vazio" role="status">Preparando o painel.</p></section>
      </main>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script src="../../js/page-loader.js" data-base="../../js/"></script>
</body>
</html>
